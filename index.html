<html lang="en">
<head>

  <meta property="og:description" content="From logs to insights. AI agents that run your sawmill operations — so you can focus on what matters.">
  <meta property="og:type" content="website">

  <meta property="og:image" content="https://timber.to/images/hero.jpg">
  <link rel="canonical" href="https://timber.to">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0f1a;
      --bg-card: #141626;
      --bg-secondary: #1e2036;
      --bg-muted: #1a1c30;
      --text: #ececec;
      --text-muted: #8b8b8b;
      --accent: #22c594;
      --accent-dim: rgba(34, 197, 148, 0.12);
      --border: #23253c;
      --radius: 10px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1140px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* Nav */
    nav {
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: rgba(13, 15, 26, 0.9);
      backdrop-filter: blur(12px);
      z-index: 10;
    }
    nav .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .nav-right { display: flex; align-items: center; gap: 24px; }
    .nav-links { display: flex; align-items: center; gap: 28px; }
    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--text); }
    .lang-switcher { display: flex; gap: 4px; }
    .lang-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
      text-transform: uppercase;
    }
    .lang-btn:hover { color: var(--text); border-color: var(--text-muted); }
    .lang-btn.active {
      background: var(--accent-dim);
      color: var(--accent);
      border-color: rgba(34, 197, 148, 0.3);
    }
    .nav-cta {
      background: var(--accent);
      color: var(--bg);
      padding: 8px 20px;
      border-radius: var(--radius);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.875rem;
      transition: background 0.2s;
    }
    .nav-cta:hover { background: #1eb385; }

    /* Hero — split layout */
    .hero {
      padding: 64px 0 56px;
    }
    .hero-grid {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 56px;
      align-items: center;
    }
    .hero-badge {
      display: inline-block;
      background: var(--accent-dim);
      color: var(--accent);
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
      margin-bottom: 18px;
      border: 1px solid rgba(34, 197, 148, 0.2);
    }
    .hero h1 {
      font-size: clamp(2rem, 4.4vw, 3rem);
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 18px;
      letter-spacing: -0.025em;
    }
    .hero h1 .highlight { color: var(--accent); }
    .hero .slogan {
      font-size: 1.05rem;
      color: var(--text-muted);
      margin-bottom: 22px;
      line-height: 1.55;
      font-weight: 500;
    }
    .hero-bullets {
      list-style: none;
      margin-bottom: 28px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .hero-bullets li {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text);
      font-size: 0.92rem;
    }
    .hero-bullets svg {
      width: 16px;
      height: 16px;
      color: var(--accent);
      flex-shrink: 0;
    }
    .hero-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--accent);
      color: var(--bg);
      padding: 12px 24px;
      border-radius: var(--radius);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: background 0.2s;
    }
    .btn-primary:hover { background: #1eb385; }
    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-secondary);
      color: var(--text);
      padding: 12px 24px;
      border-radius: var(--radius);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      border: 1px solid var(--border);
      transition: background 0.2s;
    }
    .btn-secondary:hover { background: var(--bg-muted); }
    .arrow-icon { width: 16px; height: 16px; }

    .hero-image {
      position: relative;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
      aspect-ratio: 690 / 440;
      background: var(--bg-card);
    }
    .hero-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Sections */
    section { padding: 56px 0; }
    .section-label {
      text-transform: uppercase;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.12em;
      margin-bottom: 12px;
    }
    section h2 {
      font-size: 1.85rem;
      font-weight: 700;
      margin-bottom: 14px;
      letter-spacing: -0.02em;
    }
    section .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      max-width: 540px;
      margin-bottom: 36px;
    }

    /* Steps — image-driven cards with auto-cycle highlight */
    #how { padding-top: 56px; padding-bottom: 56px; }
    .steps {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }
    .step {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      opacity: 0.62;
      transition: opacity 0.35s ease, transform 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
    }
    .step.active {
      opacity: 1;
      transform: translateY(-3px);
      border-color: rgba(34, 197, 148, 0.45);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(34, 197, 148, 0.25);
    }
    .step-image {
      width: 100%;
      aspect-ratio: 16 / 10;
      object-fit: cover;
      display: block;
      background: var(--bg-secondary);
      transition: filter 0.35s ease;
      filter: saturate(0.85) brightness(0.92);
    }
    .step.active .step-image {
      filter: saturate(1.05) brightness(1.02);
    }
    .step-body {
      padding: 18px 20px 22px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .step-number {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--accent-dim);
      color: var(--accent);
      font-weight: 700;
      font-size: 0.85rem;
      border: 1px solid rgba(34, 197, 148, 0.25);
      margin-bottom: 6px;
      transition: background 0.35s ease, border-color 0.35s ease, color 0.35s ease;
    }
    .step.active .step-number {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
    }
    .step h3 { font-size: 1rem; font-weight: 600; margin-bottom: 4px; }
    .step p { color: var(--text-muted); font-size: 0.86rem; line-height: 1.55; }

    @media (prefers-reduced-motion: reduce) {
      .step { opacity: 1; transition: none; }
      .step .step-image { filter: none; }
    }

    /* Features — 3x2 grid with photos */
    .feature-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }
    .feature {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: transform 0.2s, border-color 0.2s;
    }
    .feature:hover {
      transform: translateY(-2px);
      border-color: rgba(34, 197, 148, 0.3);
    }
    .feature-image {
      width: 100%;
      aspect-ratio: 16 / 10;
      object-fit: cover;
      display: block;
      background: var(--bg-secondary);
    }
    .feature-body { padding: 18px 20px 22px; }
    .feature h3 { font-size: 1rem; font-weight: 600; margin-bottom: 6px; }
    .feature p { color: var(--text-muted); font-size: 0.86rem; line-height: 1.55; }

    /* Proof — compact stats row, no big photo */
    .proof { text-align: center; padding: 56px 0 48px; }
    .proof h2 { margin-bottom: 8px; }
    .proof .subtitle { margin: 0 auto 32px; }
    .stats {
      display: flex;
      justify-content: center;
      gap: 24px;
      flex-wrap: wrap;
    }
    .stat {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px 32px;
      min-width: 170px;
    }
    .stat-value { font-size: 2rem; font-weight: 800; color: var(--accent); line-height: 1; }
    .stat-label { color: var(--text-muted); font-size: 0.8rem; font-weight: 500; margin-top: 6px; }

    /* Final CTA — split with image */
    .final-cta { padding: 56px 0 80px; }
    .cta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 48px;
      align-items: center;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 40px 44px;
    }
    .cta-copy h2 { font-size: 1.6rem; font-weight: 700; margin-bottom: 10px; }
    .cta-copy p { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 22px; }
    .cta-image {
      border-radius: var(--radius);
      overflow: hidden;
      aspect-ratio: 16 / 9;
      background: var(--bg-secondary);
    }
    .cta-image img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }

    /* Footer */
    footer {
      padding: 24px 0;
      border-top: 1px solid var(--border);
      text-align: center;
      color: var(--text-muted);
      font-size: 0.8rem;
    }
    .footer-links {
      margin-top: 10px;
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    footer a { color: var(--text-muted); text-decoration: none; }
    footer a:hover { color: var(--text); }

    @media (max-width: 860px) {
      .hero { padding: 40px 0 32px; }
      .hero-grid { grid-template-columns: 1fr; gap: 28px; }
      .hero-image { order: -1; aspect-ratio: 16 / 10; }
      .steps { grid-template-columns: 1fr; gap: 22px; }
      .feature-grid { grid-template-columns: 1fr 1fr; gap: 14px; }
      .cta-grid { grid-template-columns: 1fr; padding: 28px; }
      .cta-image { order: -1; }
      .stats { gap: 14px; }
      .stat { min-width: 0; flex: 1; padding: 18px 12px; }
      .nav-links { display: none; }
      section { padding: 40px 0; }
      .feature-body { padding: 14px 14px 18px; }
      .feature h3 { font-size: 0.92rem; }
      .feature p { font-size: 0.78rem; }
      section h2 { font-size: 1.5rem; }
    }

    @media (max-width: 460px) {
      .hero h1 { font-size: 1.9rem; }
      .feature p { display: none; }
      .feature-body { padding: 12px 12px 16px; }
    }
  </style>
</head>

    function detectLang() {
      var stored = localStorage.getItem("lang");
      if (stored && T[stored]) return stored;
      var nav = (navigator.language || "en").slice(0, 2).toLowerCase();
      return T[nav] ? nav : "en";
    }

    function setLang(lang) {
      localStorage.setItem("lang", lang);
      document.documentElement.lang = lang;
      var strings = T[lang];

      document.querySelectorAll("[data-i18n]").forEach(function (el) {
        el.textContent = strings[el.dataset.i18n] || "";
      });
      document.querySelectorAll("[data-i18n-html]").forEach(function (el) {
        el.innerHTML = strings[el.dataset.i18nHtml] || "";
      });

      document.querySelectorAll(".lang-btn").forEach(function (btn) {
        btn.classList.toggle("active", btn.dataset.lang === lang);
      });

      document.title = "Timberly — " + strings.hero_slogan.slice(0, 60);
      var desc = document.querySelector('meta[name="description"]');
      if (desc) desc.content = strings.hero_slogan;
    }

    document.querySelectorAll(".lang-btn").forEach(function (btn) {
      btn.addEventListener("click", function () { setLang(btn.dataset.lang); });
    });

    setLang(detectLang());

    // Auto-cycle highlight on "Cómo funciona" steps. Pauses on hover. Disabled if user prefers reduced motion.
    (function cycleSteps() {
      var steps = Array.from(document.querySelectorAll("#how .step"));
      if (steps.length === 0) return;
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (reduce) {
        steps.forEach(function (s) { s.classList.add("active"); });
        return;
      }

      var i = 0;
      function tick() {
        steps.forEach(function (s, idx) { s.classList.toggle("active", idx === i); });
        i = (i + 1) % steps.length;
      }
      tick();
      var timer = setInterval(tick, 1500);

      // Pause on hover, resume on leave (use the section as the hover target).
      var section = document.getElementById("how");
      if (section) {
        section.addEventListener("mouseenter", function () { clearInterval(timer); }, { passive: true });
        section.addEventListener("mouseleave", function () { timer = setInterval(tick, 1500); }, { passive: true });
      }
    })();
  </script>
